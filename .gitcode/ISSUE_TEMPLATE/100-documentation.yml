name: 📚 Documentation
description: 反馈文档问题
title: "[Doc]: "
labels: ["document"]

body:
- type: markdown
  attributes:
    value: >
      **在提交新问题之前，请确保您已经在社区中搜索过相关问题，并使用了社区中提供的资源/工具后，仍未找到满意的解决方式。**
- type: textarea
  attributes:
    label: 📚 文档问题描述
    description: >
      请清晰的描述文档中存在的问题，并附上文档链接及截图。
  validations:
    required: true
- type: textarea
  attributes:
    label: 建议的替代/修复方案
    description: >
      请告诉我们如何可以更好的改进文档，后续的开发者可以更容易的理解文档中的内容。
- type: markdown
  attributes:
    value: >
      欢迎加入社区，感谢您对社区的贡献 🎉!
